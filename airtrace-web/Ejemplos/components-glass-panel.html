<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head>
<body>
<style>
  body { background: linear-gradient(135deg, #1e3a4a 0%, #0f2536 40%, #07101a 100%); position: relative; }
  body::before {
    content: '';
    position: absolute; inset: 0;
    background-image:
      radial-gradient(circle at 30% 40%, rgba(96,165,250,0.18) 0, transparent 30%),
      radial-gradient(circle at 70% 60%, rgba(16,185,129,0.10) 0, transparent 35%);
    pointer-events: none;
  }
</style>
<div class="card">
<div class="eyebrow" style="color:#CBD5E1;">Glassmorphism · floating panel over the map</div>
<div style="display:flex; gap:14px; align-items:flex-start; flex-wrap:wrap;">
  <div style="background:rgba(2,6,23,0.80); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border:1px solid rgba(255,255,255,0.10); border-radius:12px; padding:14px 16px; box-shadow:0 18px 40px rgba(0,0,0,0.50); min-width:240px;">
    <div class="eyebrow" style="margin-bottom:8px;">Window</div>
    <div class="mono" style="color:#F1F5F9; font-size:13px;">2023-06 → 2024-11</div>
    <div style="margin-top:10px; height:4px; background:rgba(255,255,255,0.10); border-radius:9999px; position:relative;">
      <div style="position:absolute; left:20%; right:25%; top:0; bottom:0; background:#10B981; border-radius:9999px;"></div>
    </div>
  </div>
  <div style="background:rgba(2,6,23,0.80); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border:1px solid rgba(255,255,255,0.10); border-radius:12px; padding:10px 14px; box-shadow:0 18px 40px rgba(0,0,0,0.50);">
    <div class="mono" style="font-size:11px; color:#CBD5E1;">Seasonal factor <span style="color:#fff; font-weight:600;">× 1.18</span></div>
  </div>
</div>
<div class="dim" style="font-size:11px; color:#CBD5E1;">slate-950 / 80% + 12 px gaussian blur + 1 px white-10% border + shadow-xl. The map style reads through.</div>
</div></body></html>
